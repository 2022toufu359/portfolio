
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <title>Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans JP", "Yu Gothic", sans-serif;
      color: #222;
      background: #fff;
    }

    body.modal-open {
      overflow: hidden;
    }

    header {
      padding: 40px 5vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      margin-left: 25px;
      color: #222;
      text-decoration: none;
      font-size: 14px;
    }

    .hero {
      padding: 100px 5vw 120px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: clamp(48px, 9vw, 110px);
      line-height: 1;
      margin: 0 0 30px;
      letter-spacing: -0.04em;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.8;
      max-width: 650px;
    }

    .works {
      padding: 40px 5vw 120px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .works h2 {
      font-size: 32px;
      margin-bottom: 40px;
    }

    /* 作品一覧 */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 36px 24px;
    }

    .work-card {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .thumbnail {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #f0f0f0;
    }

    .thumbnail img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      transition: transform 0.3s ease;
    }

    .thumbnail.has-image img {
      display: block;
    }

    .thumbnail-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #888;
      font-size: 13px;
    }

    .thumbnail.has-image .thumbnail-placeholder {
      display: none;
    }

    .work-card:hover .thumbnail img {
      transform: scale(1.03);
    }

    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 4px;
      font-size: 19px;
    }

    .work-title {
      font-size: 17px;
      font-weight: 500;
      margin: 14px 0 5px;
    }

    .work-type {
      font-size: 12px;
      color: #777;
      margin: 0;
    }

    /* About / Contact */
    .about-text,
    .contact-text {
      line-height: 1.8;
      color: #555;
    }

    footer {
      padding: 50px 5vw;
      border-top: 1px solid #ddd;
      font-size: 13px;
      color: #777;
    }

    /* ポップアップ */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 30px;
      background: rgba(0, 0, 0, 0.92);
    }

    .modal.is-open {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: min(100%, 1000px);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-close {
      position: fixed;
      top: 18px;
      right: 25px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 38px;
      line-height: 1;
      cursor: pointer;
      padding: 5px 10px;
    }

    .modal-image {
      display: none;
      max-width: 100%;
      max-height: calc(100vh - 130px);
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .modal-video {
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      background: #000;
    }

    .modal-caption {
      color: #fff;
      font-size: 14px;
      margin-top: 14px;
      text-align: center;
    }

    @media (max-width: 600px) {
      header {
        padding: 25px;
      }

      nav {
        display: none;
      }

      .hero {
        padding: 70px 25px 90px;
      }

      .works {
        padding: 30px 25px 80px;
      }

      .works-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .modal {
        padding: 55px 12px 20px;
      }

      .modal-close {
        top: 10px;
        right: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Portfolio</div>
    <nav>
      <a href="#works">Works</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Visual<br>Works.</h1>
      <p>作品を中心としたポートフォリオです。</p>
    </section>

    <section class="works" id="works">
      <h2>Works</h2>

      <div class="works-grid">

        <!-- 画像作品：srcを自分の画像ファイルに変更 -->
        <button class="work-card"
          data-kind="image"
          data-src="images/graphic-01.jpg"
          data-title="Graphic Design">
          <div class="thumbnail">
            <img src="images/graphic-01.jpg" alt="グラフィック作品">
            <span class="thumbnail-placeholder">Image 01</span>
          </div>
          <p class="work-title">Graphic Design 01</p>
          <p class="work-type">Graphic Design</p>
        </button>

        <button class="work-card"
          data-kind="image"
          data-src="images/photo-01.jpg"
          data-title="Photography">
          <div class="thumbnail">
            <img src="images/photo-01.jpg" alt="写真作品">
            <span class="thumbnail-placeholder">Image 02</span>
          </div>
          <p class="work-title">Photography 01</p>
          <p class="work-type">Photography</p>
        </button>

        <!-- 動画作品：YouTubeの動画IDを設定 -->
        <button class="work-card"
          data-kind="video"
          data-video="YOUR_VIDEO_ID"
          data-title="Brand Movie">
          <div class="thumbnail">
            <img src="images/movie-01.jpg" alt="動画作品">
            <span class="thumbnail-placeholder">Movie 01</span>
            <span class="play-icon" aria-hidden="true">▶</span>
          </div>
          <p class="work-title">Brand Movie 01</p>
          <p class="work-type">Movie</p>
        </button>

        <button class="work-card"
          data-kind="image"
          data-src="images/graphic-02.jpg"
          data-title="Graphic Design">
          <div class="thumbnail">
            <img src="images/graphic-02.jpg" alt="グラフィック作品">
            <span class="thumbnail-placeholder">Image 03</span>
          </div>
          <p class="work-title">Graphic Design 02</p>
          <p class="work-type">Graphic Design</p>
        </button>

      </div>
    </section>
    
    <section class="works" id="about">
      <h2>About</h2>
      <p class="about-text">好奇心</p>
    </section>
    <section class="works" id="about">
      <h2>About</h2>
      <p class="about-text">好奇心</p>
    </section>

    <section class="works" id="contact">
      <h2>Contact</h2>
      <p class="contact-text">お問い合わせはこちらから。</p>
    </section>
  </main>

  <footer>
    © 2026 Portfolio
  </footer>

  <!-- 共通ポップアップ -->
  <div class="modal" id="work-modal"
       role="dialog" aria-modal="true"
       aria-label="作品プレビュー">
    <button class="modal-close" id="modal-close"
            aria-label="閉じる">×</button>

    <div class="modal-content">
      <img class="modal-image" id="modal-image" alt="">
      <iframe class="modal-video" id="modal-video"
        title="YouTube動画プレーヤー"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
      <p class="modal-caption" id="modal-caption"></p>
    </div>
  </div>

  <script>
    const modal = document.getElementById("work-modal");
    const modalImage = document.getElementById("modal-image");
    const modalVideo = document.getElementById("modal-video");
    const modalCaption = document.getElementById("modal-caption");
    const closeButton = document.getElementById("modal-close");

    // 読み込めた画像だけ表示。未設定の画像はプレースホルダーを残す
    document.querySelectorAll(".thumbnail img").forEach((img) => {
      img.addEventListener("load", () => {
        img.closest(".thumbnail").classList.add("has-image");
      });

      img.addEventListener("error", () => {
        img.closest(".thumbnail").classList.remove("has-image");
      });

      if (img.complete && img.naturalWidth > 0) {
        img.closest(".thumbnail").classList.add("has-image");
      }
    });

    function openModal(card) {
      const kind = card.dataset.kind;
      const title = card.dataset.title || "";

      modalImage.style.display = "none";
      modalVideo.style.display = "none";
      modalVideo.src = "";
      modalImage.src = "";
      modalCaption.textContent = title;

      if (kind === "video") {
        const videoId = card.dataset.video;

        if (!videoId || videoId === "YOUR_VIDEO_ID") {
          modalCaption.textContent =
            "YouTubeの動画IDを設定すると、ここで再生できます。";
        } else {
          modalVideo.src =
            "https://www.youtube-nocookie.com/embed/" +
            encodeURIComponent(videoId) + "?autoplay=1";
          modalVideo.style.display = "block";
        }
      } else {
        modalImage.src = card.dataset.src;
        modalImage.alt = title;
        modalImage.style.display = "block";
      }

      modal.classList.add("is-open");
      document.body.classList.add("modal-open");
      closeButton.focus();
    }

    function closeModal() {
      modal.classList.remove("is-open");
      document.body.classList.remove("modal-open");

      // 閉じたら動画を停止
      modalVideo.src = "";
      modalImage.src = "";
    }

    document.querySelectorAll(".work-card").forEach((card) => {
      card.addEventListener("click", () => openModal(card));
    });

    closeButton.addEventListener("click", closeModal);

    // 黒い背景部分をクリックしたら閉じる
    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });

    // Escapeキーでも閉じる
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("is-open")) {
        closeModal();
      }
    });
  </script>

</body>
</html>
